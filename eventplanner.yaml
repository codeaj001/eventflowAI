openapi: 3.0.0
info:
  title: EventFlow AI Tools
  version: 1.0.0

servers:
  - url: https://eventflow-ai.vercel.app

paths:
  /api/webhook/orchestrate:
    post:
      summary: Handles Orchestrate event actions
      description: Receives tool calls from Orchestrate to create or complete events.
      operationId: orchestrateWebhook
      parameters:
        - in: header
          name: x-webhook-secret
          description: Secret key for securing webhook requests
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - create_event
                    - complete_event
                payload:
                  type: object
      responses:
        "200":
          description: Successful response
        "400":
          description: Bad request
        "401":
          description: Unauthorized
